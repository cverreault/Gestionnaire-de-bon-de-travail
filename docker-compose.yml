# ─── TaskMgr — Docker Compose ─────────────────────────────────────────────────
# Ports NON-STANDARD (cohabitation avec d'autres containers) :
#   PostgreSQL  : 5434:5432
#   MinIO API   : 9010:9000  |  Console : 9011:9001
#   Backend     : 3800:3000
#   Frontend    : 3801:80
#   Nginx       : 8088:80  ← point d'entrée public routé depuis Nginx externe

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: taskmgr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-taskmgr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskmgr_secret}
      POSTGRES_DB:       ${POSTGRES_DB:-taskmgr}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskmgr} -d ${POSTGRES_DB:-taskmgr}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - taskmgr-network
    labels:
      com.taskmgr.service:     "postgres"
      com.taskmgr.role:        "database"
      com.taskmgr.description: "PostgreSQL 16 — store de données principal"

  # ── MinIO ────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: taskmgr_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    networks:
      - taskmgr-network
    labels:
      com.taskmgr.service:     "minio"
      com.taskmgr.role:        "object-storage"
      com.taskmgr.description: "MinIO — stockage S3-compatible pour les pièces jointes"

  # ── Valhalla (routage, matrices de temps, tournées) ─────────────────────────
  # Données OpenStreetMap du Québec (Geofabrik). Le premier démarrage télécharge
  # le .pbf (~500 Mo) et construit les tuiles (30 à 60 min, ~2 Go) dans le volume ;
  # les démarrages suivants réutilisent les tuiles. Réseau interne seulement :
  # le backend l'appelle sur http://valhalla:8002 (VALHALLA_URL).
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    container_name: taskmgr_valhalla
    restart: unless-stopped
    environment:
      tile_urls: ${VALHALLA_TILE_URLS:-https://download.geofabrik.de/north-america/canada/quebec-latest.osm.pbf}
      use_tiles_ignore_pbf: "True"
      force_rebuild: "False"
      build_elevation: "False"
      build_admins: "True"
      build_time_zones: "True"
      build_transit: "False"
      build_tar: "True"
      serve_tiles: "True"
      server_threads: "2"
    volumes:
      - valhalla_data:/custom_files
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8002/status || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 3600s
    networks:
      - taskmgr-network
    labels:
      com.taskmgr.service:     "valhalla"
      com.taskmgr.role:        "routing"
      com.taskmgr.description: "Valhalla — itinéraires, matrices et tournées sur OSM Québec"

  # ── Backend NestJS ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: taskmgr_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV:       production
      DATABASE_URL:   postgresql://${POSTGRES_USER:-taskmgr}:${POSTGRES_PASSWORD:-taskmgr_secret}@postgres:5432/${POSTGRES_DB:-taskmgr}
      MINIO_ENDPOINT: minio
      MINIO_PORT:     "9000"
    ports:
      - "3800:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - taskmgr-network
    labels:
      com.taskmgr.service:     "backend"
      com.taskmgr.role:        "api"
      com.taskmgr.description: "NestJS REST API — gestion des bons de travail"

  # ── Frontend React PWA ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        # Base domain for tenant subdomain previews (slug.<domaine>). Set
        # VITE_BASE_DOMAIN in .env to your real domain before building.
        VITE_BASE_DOMAIN: ${VITE_BASE_DOMAIN:-taskmgr.local}
    container_name: taskmgr_frontend
    restart: unless-stopped
    ports:
      - "3801:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - taskmgr-network
    labels:
      com.taskmgr.service:     "frontend"
      com.taskmgr.role:        "web"
      com.taskmgr.description: "React PWA — interface de gestion des tâches"

  # ── Nginx reverse proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: taskmgr_nginx
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Fichiers à télécharger (APK de test de l'app mobile) : https://<domaine>/downloads/
      - ./downloads:/var/www/downloads:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - taskmgr-network
    labels:
      com.taskmgr.service:     "nginx"
      com.taskmgr.role:        "reverse-proxy"
      com.taskmgr.description: "Nginx — point d'entrée public sur :8088"

# ─── Volumes nommés (persistance) ─────────────────────────────────────────────
volumes:
  postgres_data:
    name: taskmgr_postgres_data
  minio_data:
    name: taskmgr_minio_data
  valhalla_data:
    name: taskmgr_valhalla_data

# ─── Réseau dédié isolé ───────────────────────────────────────────────────────
networks:
  taskmgr-network:
    name: taskmgr-network
    driver: bridge
